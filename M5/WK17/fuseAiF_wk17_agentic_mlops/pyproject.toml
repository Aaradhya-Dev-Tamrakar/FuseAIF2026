[project]
name = "fuseaif-wk17-agentic-mlops"
version = "0.1.0"
description = "Agentic AI MLOps Pipeline: Trace Tracking, Prompt Iterations, and Evidently LLM-as-a-Judge (Fuse AI Fellowship 2026 Week 17 Track B)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "evidently>=0.4.30",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.15.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.40.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE", "RUF"]
ignore = [
    "BLE001",
    "S110",
    "S112",
    "S104",
    "S307",
    "S311",
    "S324",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402"]
"eval/**" = ["S101"]
"dags/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
